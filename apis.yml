name: Minted
description: 'Minted is a San Francisco-based online design marketplace that crowdsources
  graphic and fine-art designs from a global community of independent artists and sells
  the winning work as stationery, wedding invitations, holiday cards, art prints, home
  decor, and personalized gifts. Its e-commerce storefront at minted.com pairs artist-submitted
  designs with in-house printing and fulfillment. This profile was surfaced as a portfolio
  company of Norwest Venture Partners and Slow Ventures and added to the API Evangelist
  network; the enrichment pass probed for any public developer surface and found no
  documented public API — Minted operates as a direct-to-consumer commerce brand, not
  an API provider.'
